<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>유튜브 리서치 공유</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="ytr-build" content="53e7fd5fadc2">
<style>
:root {
  --bg: #f6f5f1; --panel: #ffffff; --panel-2: #fbfaf7; --ink: #1d1c1a; --ink-2: #55524c; --ink-3: #8b877f;
  --line: #e6e3dc; --line-2: #d6d2c8; --accent: #c8372d; --accent-soft: #fbe9e6; --accent-ink: #9d241c;
  --pop: #b7791f; --pop-soft: #fdf3dc; --like: #c0325f; --like-soft: #fce8ef; --rep: #3d52b4; --rep-soft: #e8ebfa;
  --good: #2f7d4f; --good-soft: #e3f3e9; --bad: #b3372e; --bad-soft: #fae7e5; --mix: #7a5ea8; --mix-soft: #efe9f8;
  --shadow: 0 1px 2px rgba(30, 25, 15, .05), 0 4px 16px rgba(30, 25, 15, .04);
  --radius: 12px;
  --font: "Pretendard Variable", Pretendard, "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161514; --panel: #1f1e1c; --panel-2: #242320; --ink: #eceae4; --ink-2: #b5b1a8; --ink-3: #807c74;
    --line: #32302c; --line-2: #45423c; --accent: #ef6a5e; --accent-soft: #3a211e; --accent-ink: #ff9b91;
    --pop: #e0a84a; --pop-soft: #3a2f18; --like: #ee7aa0; --like-soft: #3b1f2a; --rep: #8b9cf0; --rep-soft: #232a4a;
    --good: #6cc48f; --good-soft: #1d3327; --bad: #ee8279; --bad-soft: #3a211f; --mix: #b59be0; --mix-soft: #2d2540;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font); background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.65;
  -webkit-font-smoothing: antialiased; word-break: keep-all; overflow-wrap: anywhere; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }

#app { display: grid; grid-template-columns: 264px minmax(0, 1fr); min-height: 100vh; }
#app.static { grid-template-columns: minmax(0, 1fr); }
#app.static #sidebar { display: none; }

/* ---------- sidebar ---------- */
#sidebar { background: var(--panel); border-right: 1px solid var(--line); padding: 22px 14px; position: sticky; top: 0;
  height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; font-weight: 750; font-size: 17px; letter-spacing: -.02em; cursor: pointer; }
.brand-mark { width: 30px; height: 22px; border-radius: 6px; background: var(--accent); position: relative; flex: none; }
.brand-mark::after { content: ""; position: absolute; left: 12px; top: 6px; border-left: 9px solid #fff; border-top: 5px solid transparent; border-bottom: 5px solid transparent; }
.side-label { font-size: 12px; color: var(--ink-3); padding: 0 8px; font-weight: 600; letter-spacing: .02em; }
.proj-list { display: flex; flex-direction: column; gap: 2px; }
.proj-item { padding: 9px 10px; border-radius: 9px; cursor: pointer; border: 1px solid transparent; }
.proj-item:hover { background: var(--panel-2); }
.proj-item.active { background: var(--accent-soft); border-color: transparent; }
.proj-item .t { font-weight: 620; font-size: 14px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.proj-item .m { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.side-foot { margin-top: auto; font-size: 12px; color: var(--ink-3); padding: 10px 8px 0; border-top: 1px solid var(--line); line-height: 1.5; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--ink-3); }
.dot.ok { background: var(--good); } .dot.bad { background: var(--bad); }

/* ---------- common ---------- */
#main { padding: 34px clamp(18px, 4vw, 52px) 90px; max-width: 1240px; width: 100%; margin: 0 auto; }
.btn { border: 1px solid var(--line-2); background: var(--panel); padding: 8px 14px; border-radius: 9px; cursor: pointer; font-weight: 600; font-size: 14px;
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
a.btn { text-decoration: none; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--panel-2); }
.btn.sm { padding: 5px 10px; font-size: 13px; border-radius: 8px; }
.btn.wide { width: 100%; justify-content: center; padding: 11px; }
.btn:disabled { opacity: .5; cursor: default; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px 24px; }
.muted { color: var(--ink-3); } .small { font-size: 13px; }
h1 { font-size: 27px; line-height: 1.3; letter-spacing: -.03em; margin: 0; font-weight: 780; }
h2 { font-size: 19px; letter-spacing: -.02em; margin: 40px 0 14px; font-weight: 740; display: flex; align-items: baseline; gap: 10px; }
h2 .sub { font-size: 13px; font-weight: 500; color: var(--ink-3); letter-spacing: 0; }
h3 { font-size: 15.5px; margin: 0 0 6px; font-weight: 700; letter-spacing: -.01em; }
p { margin: 0 0 10px; } p:last-child { margin-bottom: 0; }
ul.clean { margin: 0; padding-left: 1.15em; } ul.clean li { margin: 5px 0; } ul.clean li::marker { color: var(--ink-3); }
.grid { display: grid; gap: 14px; } .g2 { grid-template-columns: repeat(auto-fit, minmax(min(330px, 100%), 1fr)); } .g3 { grid-template-columns: repeat(auto-fit, minmax(min(270px, 100%), 1fr)); }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 650; padding: 2px 9px; border-radius: 99px; background: var(--panel-2); border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
.chip.pop { background: var(--pop-soft); color: var(--pop); border-color: transparent; }
.chip.like { background: var(--like-soft); color: var(--like); border-color: transparent; }
.chip.rep { background: var(--rep-soft); color: var(--rep); border-color: transparent; }
.chip.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.chip.mix { background: var(--mix-soft); color: var(--mix); border-color: transparent; }
.chip.accent { background: var(--accent-soft); color: var(--accent-ink); border-color: transparent; }
.chip.click { cursor: pointer; } .chip.click:hover { filter: brightness(.96); }

/* ---------- new project ---------- */
.hero-new { max-width: 780px; margin: 3vh auto 0; }
.hero-new .lead { color: var(--ink-2); margin: 10px 0 26px; font-size: 16px; }
.field { margin-bottom: 18px; }
.field label { display: flex; justify-content: space-between; align-items: baseline; font-weight: 650; font-size: 14px; margin-bottom: 6px; }
.field label span { font-weight: 450; color: var(--ink-3); font-size: 13px; }
input[type=text], input[type=search], textarea, select { width: 100%; border: 1px solid var(--line-2); border-radius: 10px; padding: 10px 12px; background: var(--panel); outline: none; }
input:focus, textarea:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea { resize: vertical; min-height: 120px; line-height: 1.55; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; } .row > .grow { flex: 1 1 200px; }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-top: 28px; }
.steps div { font-size: 13px; color: var(--ink-2); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.steps b { display: block; color: var(--ink); font-size: 14px; margin-bottom: 2px; }

/* ---------- project header ---------- */
.p-head { display: flex; justify-content: space-between; gap: 18px; align-items: flex-start; flex-wrap: wrap; }
.p-head .eyebrow { font-size: 13px; color: var(--accent-ink); font-weight: 700; margin-bottom: 4px; }
.stats { display: flex; gap: 26px; flex-wrap: wrap; margin-top: 16px; }
.stat b { display: block; font-size: 22px; font-weight: 760; letter-spacing: -.02em; line-height: 1.2; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12.5px; color: var(--ink-3); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 26px 0 26px; overflow-x: auto; }
.tab { padding: 10px 16px; cursor: pointer; font-weight: 650; color: var(--ink-3); border-bottom: 2.5px solid transparent; margin-bottom: -1px; white-space: nowrap; background: none; border-top: 0; border-left: 0; border-right: 0; }
.tab:hover { color: var(--ink); } .tab.active { color: var(--ink); border-bottom-color: var(--accent); }
.tab .n { font-weight: 500; font-size: 12.5px; margin-left: 4px; color: var(--ink-3); }

/* ---------- job progress ---------- */
.job { margin-top: 20px; border-color: var(--accent); }
.job-head { display: flex; align-items: center; gap: 10px; font-weight: 700; margin-bottom: 12px; }
.spinner { width: 16px; height: 16px; border-radius: 50%; border: 2.5px solid var(--accent-soft); border-top-color: var(--accent); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.job-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.job-table td, .job-table th { padding: 7px 8px; border-top: 1px solid var(--line); text-align: left; }
.job-table th { font-weight: 600; color: var(--ink-3); font-size: 12px; border-top: 0; }
.st { font-size: 12px; font-weight: 650; padding: 2px 8px; border-radius: 99px; background: var(--panel-2); color: var(--ink-3); white-space: nowrap; }
.st.running { background: var(--accent-soft); color: var(--accent-ink); } .st.done { background: var(--good-soft); color: var(--good); }
.st.error { background: var(--bad-soft); color: var(--bad); }
.job-log { margin-top: 10px; font-size: 12.5px; color: var(--ink-3); max-height: 96px; overflow: auto; font-variant-numeric: tabular-nums; }

/* ---------- synthesis ---------- */
.headline { font-size: 23px; font-weight: 760; line-height: 1.42; letter-spacing: -.025em; margin: 0 0 12px; }
.headline-card { border-left: 4px solid var(--accent); }
.interest { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 4px 14px; padding: 20px 0; border-top: 1px solid var(--line); }
.interest:first-child { border-top: 0; padding-top: 4px; }
.interest .rank { font-size: 24px; font-weight: 780; color: var(--line-2); line-height: 1.15; font-variant-numeric: tabular-nums; }
.interest .ttl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
.interest .ttl h3 { margin: 0; font-size: 16.5px; }
.meter { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--ink-3); margin: 8px 0 8px; flex-wrap: wrap; }
.bar { height: 7px; border-radius: 99px; background: var(--line); width: 170px; overflow: hidden; flex: none; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.direction { font-size: 14px; color: var(--ink-2); background: var(--panel-2); border-radius: 9px; padding: 9px 12px; margin: 8px 0; }
.direction b { color: var(--ink); }
.quotes { display: grid; gap: 8px; margin-top: 10px; }
.quote { border-left: 3px solid var(--line-2); padding: 3px 0 3px 12px; font-size: 14px; color: var(--ink-2); }
.quote .qm { display: flex; gap: 10px; font-size: 12px; color: var(--ink-3); margin-top: 3px; flex-wrap: wrap; align-items: center; }
.quote a { text-decoration: none; } .quote a:hover { text-decoration: underline; }
.lens { border-top: 3px solid var(--line-2); }
.lens.pop { border-top-color: var(--pop); } .lens.like { border-top-color: var(--like); } .lens.rep { border-top-color: var(--rep); }
.lens h3 { display: flex; align-items: center; gap: 8px; }
.lens .hint { font-size: 12.5px; color: var(--ink-3); margin: -2px 0 10px; }
.sides { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; margin: 8px 0; }
.side { background: var(--panel-2); border-radius: 9px; padding: 9px 12px; font-size: 14px; }
.side b { font-size: 12px; color: var(--ink-3); display: block; }
.reco-title { font-weight: 700; } .reco-why { color: var(--ink-2); font-size: 14px; }
.idea { padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); font-weight: 600; }
.idea-list { display: grid; gap: 8px; }
.check-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 14px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14.5px; }
.check-row:first-of-type { border-top: 0; }
.check-row .k { font-weight: 650; } .check-row .v { color: var(--ink-2); }
.vtag { font-size: 11.5px; font-weight: 700; color: var(--ink-3); border: 1px solid var(--line-2); border-radius: 6px; padding: 0 6px; cursor: pointer; white-space: nowrap; }
.vtag:hover { color: var(--accent-ink); border-color: var(--accent); }
.stance-bar { display: flex; height: 14px; border-radius: 99px; overflow: hidden; margin: 12px 0 14px; gap: 2px; }
.stance-bar i { display: block; height: 100%; }
.stance-row { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 6px 0; font-size: 14.5px; }
.stance-row .sw { width: 10px; height: 10px; border-radius: 3px; align-self: center; }
.stance-row .pct { font-weight: 720; font-variant-numeric: tabular-nums; }
.stance-row .d { color: var(--ink-2); font-size: 14px; }

/* ---------- videos ---------- */
.vlist { display: grid; gap: 10px; }
.vrow { display: grid; grid-template-columns: 168px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 12px; cursor: pointer; }
.vrow:hover { border-color: var(--line-2); } .vrow.active { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.vrow img { width: 168px; aspect-ratio: 16/9; object-fit: cover; border-radius: 8px; display: block; background: var(--line); }
.vrow .vt { font-weight: 700; font-size: 15.5px; line-height: 1.4; }
.vrow .vm { font-size: 13px; color: var(--ink-3); margin-top: 3px; display: flex; gap: 12px; flex-wrap: wrap; }
.vrow .one { font-size: 14px; color: var(--ink-2); margin-top: 6px; }
.vnum { font-size: 12px; font-weight: 750; color: var(--accent-ink); margin-right: 6px; }
.subtabs { display: flex; gap: 6px; margin: 22px 0 18px; flex-wrap: wrap; }
.subtab { padding: 6px 14px; border-radius: 99px; border: 1px solid var(--line-2); background: var(--panel); cursor: pointer; font-weight: 620; font-size: 14px; }
.subtab.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.kp { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
.kp:first-child { border-top: 0; }
.ts { font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 650; color: var(--accent-ink); text-decoration: none; }
.ts:hover { text-decoration: underline; }
.kp .pt { font-weight: 680; } .kp .dt { color: var(--ink-2); font-size: 14.5px; }
table.data { width: 100%; border-collapse: collapse; font-size: 14px; }
table.data th { text-align: left; font-size: 12px; color: var(--ink-3); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); }
table.data td { padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.data tr:last-child td { border-bottom: 0; }
.transcript p { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 12px; margin: 0; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14.5px; color: var(--ink-2); }
.transcript p:first-child { border-top: 0; }

/* ---------- comments explorer ---------- */
.c-controls { display: grid; gap: 12px; position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 0 14px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line-2); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 6px 13px; border-radius: 7px; cursor: pointer; font-weight: 640; font-size: 14px; color: var(--ink-2); }
.seg button.active { background: var(--ink); color: var(--bg); }
.seg button.active.pop { background: var(--pop); color: #fff; } .seg button.active.like { background: var(--like); color: #fff; } .seg button.active.rep { background: var(--rep); color: #fff; }
.c-item { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 12px; padding: 15px 0; border-top: 1px solid var(--line); }
.c-rank { font-size: 15px; font-weight: 760; color: var(--ink-3); text-align: right; font-variant-numeric: tabular-nums; padding-top: 1px; }
.c-text { white-space: pre-wrap; font-size: 15px; }
.c-meta { display: flex; gap: 8px 12px; flex-wrap: wrap; align-items: center; font-size: 12.5px; color: var(--ink-3); margin-top: 7px; }
.c-meta .num { font-weight: 700; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.c-meta .num.hl-like { color: var(--like); } .c-meta .num.hl-rep { color: var(--rep); } .c-meta .num.hl-pop { color: var(--pop); }
.c-meta a { text-decoration: none; } .c-meta a:hover { text-decoration: underline; }
.replies { margin: 10px 0 0; padding: 4px 0 4px 14px; border-left: 2px solid var(--rep-soft); display: grid; gap: 9px; }
.reply { font-size: 14px; color: var(--ink-2); } .reply .c-meta { margin-top: 2px; }
mark { background: var(--pop-soft); color: inherit; border-radius: 3px; padding: 0 1px; }
.empty { text-align: center; padding: 60px 20px; color: var(--ink-3); }
.filter-note { font-size: 13px; color: var(--ink-2); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.acc-foot { cursor: pointer; border-radius: 9px; padding: 8px; margin: -4px -8px 0; display: grid; gap: 2px; }
.acc-foot:hover { background: var(--panel-2); } .acc-foot b { color: var(--ink); font-size: 12.5px; }
.modal-back { position: fixed; inset: 0; background: rgba(20, 18, 14, .45); z-index: 40; display: flex; align-items: flex-start; justify-content: center; padding: 8vh 16px 16px; overflow-y: auto; }
.modal { width: min(720px, 100%); box-shadow: 0 24px 80px rgba(0,0,0,.3); }
.modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; } .modal-head h3 { font-size: 18px; margin: 0; }
.acc-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 13px 14px; border: 1px solid var(--line); border-radius: 11px; margin-top: 10px; }
.acc-row.active { border-color: var(--accent); background: var(--accent-soft); }
.acc-info { min-width: 0; } .acc-info > div:first-child { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.acc-add { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; } .acc-add input { flex: 1 1 260px; }
.acc-help { margin-top: 14px; padding: 12px 14px; border-radius: 10px; background: var(--pop-soft); font-size: 13.5px; line-height: 1.7; }
.acc-cmd { margin-top: 8px; font-family: Consolas, Menlo, monospace; font-size: 12.5px; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; user-select: all; overflow-wrap: anywhere; }

.share-link { display: flex; gap: 8px; margin-top: 14px; } .share-link input { flex: 1; font-size: 13px; font-family: Consolas, Menlo, monospace; }
.share-opt { display: block; font-size: 14px; font-weight: 600; cursor: pointer; line-height: 1.6; } .share-opt input { margin-right: 6px; } .share-opt span { font-weight: 400; }
code { font-family: Consolas, Menlo, monospace; font-size: .92em; background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; }

#toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 10px; font-size: 14px; font-weight: 600; z-index: 50; box-shadow: 0 8px 30px rgba(0,0,0,.25); max-width: 90vw; }
.menu { position: relative; } .menu-pop { position: absolute; right: 0; top: calc(100% + 6px); background: var(--panel); border: 1px solid var(--line-2); border-radius: 11px; box-shadow: 0 10px 40px rgba(0,0,0,.14); padding: 6px; z-index: 20; min-width: 250px; }
.menu-pop button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 9px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; }
.menu-pop button:hover { background: var(--panel-2); } .menu-pop button small { display: block; color: var(--ink-3); font-size: 12px; }
.menu-pop button.danger { color: var(--bad); }

@media (max-width: 860px) {
  #app { grid-template-columns: minmax(0, 1fr); }
  #sidebar { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  .side-foot { display: none; }
  .vrow { grid-template-columns: 110px minmax(0, 1fr); } .vrow img { width: 110px; } .vrow .vact { display: none; }
  .check-row { grid-template-columns: minmax(0, 1fr); gap: 2px; }
}

<script id="ytr-app" type="text/plain">
/* 유튜브 리서치 — 단일 페이지 앱. 서버 모드와 내보내기(정적) 모드를 함께 지원한다. */
(() => {
  const STATIC = window.__STATIC_BUNDLE__ || null;
  const SHARED = !!window.__YTR_SHARED__; let vhash = "#/";
  const S = { projects: [], health: null, slug: null, bundle: null, tab: "synthesis", videoId: null, subtab: "summary",
              cf: { video: "all", sort: "popular", q: "", keywords: null, label: "", limit: 50, openReplies: {} },
              pollTimer: null, share: null, sharePoll: null, accounts: null, accPoll: null, accHelp: "", newForm: { title: "", urls: "", brief: "", briefName: "", max: "2000", model: "" } };
  const $ = (s, el = document) => el.querySelector(s);
  const main = $("#main"), sidebar = $("#sidebar");

  // ---------- utils ----------
  const h = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const num = (n) => (n == null ? "-" : Number(n).toLocaleString("ko-KR"));
  const big = (n) => { if (n == null) return "-"; n = Number(n);
    if (n >= 1e8) return (n / 1e8).toFixed(1).replace(/\.0$/, "") + "억";
    if (n >= 1e4) return (n / 1e4).toFixed(n >= 1e5 ? 0 : 1).replace(/\.0$/, "") + "만";
    return n.toLocaleString("ko-KR"); };
  const list = (arr, cls = "clean") => (arr && arr.length ? `<ul class="${cls}">${arr.map((x) => `<li>${h(x)}</li>`).join("")}</ul>` : `<p class="muted small">해당 없음</p>`);
  const tsSec = (ts) => { const p = String(ts || "0").split(":").map(Number); return p.reduce((a, b) => a * 60 + (b || 0), 0); };
  function toast(msg, ms = 2600) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => (t.hidden = true), ms); }
  async function api(path, opt = {}) {
    const headers = { "X-Requested-With": "ytr" };
    if (opt.body && !(opt.body instanceof FormData)) headers["Content-Type"] = "application/json";
    const res = await fetch(path, { ...opt, headers });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `요청 실패 (${res.status})`);
    return data;
  }

  // ---------- data helpers ----------
  const videos = () => (S.bundle ? S.bundle.videos.filter((v) => v.meta) : []);
  const vIndex = (vid) => S.bundle.videos.findIndex((v) => v.id === vid) + 1;
  function commentMap() {
    if (S._cmap && S._cmapFor === S.bundle) return S._cmap;
    const m = new Map();
    for (const v of videos()) for (const c of (v.comments?.comments || [])) m.set(c.id, c);
    S._cmap = m; S._cmapFor = S.bundle; return m;
  }
  function sortComments(arr, mode) {
    const a = arr.slice();
    if (mode === "likes") a.sort((x, y) => y.likes - x.likes || x.pop_rank - y.pop_rank);
    else if (mode === "replies") a.sort((x, y) => y.reply_count - x.reply_count || y.likes - x.likes);
    else if (mode === "recent") a.sort((x, y) => String(y.date || "").localeCompare(String(x.date || "")) || x.pop_rank - y.pop_rank);
    else a.sort((x, y) => x.pop_rank - y.pop_rank || y.likes - x.likes); // 인기순: 영상별 순위를 교차 배열
    return a;
  }

  // ---------- routing ----------
  function go(hash) { if (SHARED) { vhash = hash; return route(); } if (location.hash === hash) route(); else location.hash = hash; }
  async function route() {
    const parts = decodeURIComponent((SHARED ? vhash : location.hash).replace(/^#\/?/, "")).split("/");
    if (STATIC) { S.bundle = STATIC; S.slug = STATIC.project.slug; S.tab = parts[2] || S.tab; if (parts[3]) S.videoId = parts[3]; return renderProject(); }
    if (parts[0] === "p" && parts[1]) {
      const slug = parts[1]; S.tab = parts[2] || "synthesis"; if (parts[3]) S.videoId = parts[3];
      if (S.slug !== slug || !S.bundle) { S.slug = slug; await loadBundle(); } else renderProject();
    } else { S.slug = null; S.bundle = null; stopPoll(); renderNew(); }
    renderSidebar();
  }
  async function loadBundle() {
    try { S.bundle = await api(`/api/projects/${encodeURIComponent(S.slug)}`); }
    catch (e) { toast(e.message); return go("#/"); }
    renderProject();
    if (S.bundle.job && S.bundle.job.state === "running") startPoll();
  }
  function startPoll() {
    stopPoll();
    S.pollTimer = setInterval(async () => {
      if (!S.slug) return stopPoll();
      try {
        const job = await api(`/api/projects/${encodeURIComponent(S.slug)}/job`);
        if (!job) return;
        const was = JSON.stringify(progressKey(S.bundle.job)), now = JSON.stringify(progressKey(job));
        S.bundle.job = job;
        if (job.state !== "running") { stopPoll(); await loadBundle(); loadProjects(); toast(job.state === "done" ? "분석이 끝났습니다." : "분석 중 오류가 있었습니다."); return; }
        if (was !== now) await loadBundle(); else renderJob();
      } catch (e) { /* 일시 오류 무시 */ }
    }, 2500);
  }
  const progressKey = (job) => job ? [Object.values(job.videos).map((v) => [v.meta, v.comments, v.summary, v.reaction]), job.synthesis] : null;
  function stopPoll() { clearInterval(S.pollTimer); S.pollTimer = null; }

        <div class="muted small" style="margin:8px 0 14px">${h(sh.published_at)} 게시 · ${num(sh.size_kb)}KB · ${sh.include_brief ? "대본 포함" : "대본 제외"}

  async function shareAction(act) {

  async function startLogin(id, email) {
    const before = S.accounts?.profiles?.find((x) => x.id === id); const was = before ? `${before.loggedIn}|${before.email}` : "";
    const r = await api(`/api/accounts/${id}/login`, { method: "POST", body: JSON.stringify({ email: email || "" }) });
    S.accHelp = (r.launched
      ? `<b>로그인 창과 브라우저가 열렸습니다.</b><br>① 브라우저에서 <b>연결하려는 계정</b>으로 승인하세요. 브라우저가 이미 다른 claude.ai 계정으로 로그인돼 있으면 그 계정으로 연결되니, 먼저 claude.ai에서 계정을 바꾸거나 시크릿 창에 주소를 붙여넣으세요.<br>② 검은 창에 코드를 붙여넣으라고 나오면 브라우저에 표시된 코드를 붙여넣습니다.<br>③ 완료되면 아래 목록에 이메일이 자동으로 표시됩니다.`
      : `로그인 창을 자동으로 열지 못했습니다. 터미널에서 아래 명령을 직접 실행하세요.`) + `<div class="acc-cmd">${h(r.command)}</div>`;

      if (++n > 120 || !$("#acc-modal")) { clearInterval(S.accPoll); S.accPoll = null; return; }
      await loadAccounts();
      const a = S.accounts?.profiles?.find((x) => x.id === id);
      if (a && a.loggedIn && `${a.loggedIn}|${a.email}` !== was) {
        clearInterval(S.accPoll); S.accPoll = null;
        S.accHelp = `<b>${h(a.email)}</b> 계정이 연결됐습니다.${a.active ? "" : " 「이 계정 사용」을 누르면 이 계정으로 분석합니다."}`; renderAccounts(); toast(`연결됨: ${a.email}`);

  }
  async function accountAction(act, id) {
    try {
      if (act === "close") return closeAccounts();
      if (act === "add") {
        const email = ($("#acc-email")?.value || "").trim();
        const prof = await api("/api/accounts", { method: "POST", body: JSON.stringify({ label: email }) });
        await loadAccounts(); return startLogin(prof.id, email);
      }
      const a = S.accounts?.profiles?.find((x) => x.id === id);
      if (act === "login") return startLogin(id, "");
      if (act === "activate") { await api(`/api/accounts/${id}/activate`, { method: "POST" }); S.accHelp = ""; await loadAccounts(); return toast(`이제 ${a?.email || "선택한 계정"}(으)로 분석합니다.`); }
      if (act === "logout") {
        if (!confirm(a?.is_default ? "이 PC의 Claude Code 기본 로그인입니다.\n로그아웃하면 터미널에서 쓰는 Claude Code도 함께 로그아웃됩니다. 계속할까요?" : `${a?.email || "이 계정"}에서 로그아웃할까요?`)) return;
        await api(`/api/accounts/${id}/logout`, { method: "POST" }); await loadAccounts(); return toast("로그아웃했습니다.");

    } catch (e) { toast(e.message, 4000); }
  }

          <textarea id="nf-brief" rows="4" placeholder="대본이나 기획 메모를 붙여넣거나, 아래 버튼으로 파일을 불러오세요.">${h(f.brief)}</textarea>

              .map(([v, t]) => `<option value="${v}" ${f.model === v ? "selected" : ""}>${t}</option>`).join("")}</select></div>

  async function runMode(mode, videoId) {

      return;
    }
    if (mode === "refetch" && !confirm("스크립트와 댓글을 다시 받고 분석도 새로 합니다. 진행할까요?")) return;
    try { await api(`/api/projects/${encodeURIComponent(S.slug)}/run`, { method: "POST", body: JSON.stringify({ mode, video_id: videoId }) }); await loadBundle(); startPoll(); }

  // ---------- shared renderers ----------
  function quote(c, opts = {}) {
    if (!c) return "";
    const vi = vIndex(c.video_id);
    return `<div class="quote">${h(c.text.length > 300 && !opts.full ? c.text.slice(0, 300) + "…" : c.text)}
      <div class="qm"><span>👍 ${num(c.likes)}</span><span>💬 ${num(c.reply_count)}</span><span>${c.from_recent ? "인기순 밖" : `인기 ${c.pop_rank}위`}</span>
      ${opts.showVideo === false ? "" : `<span class="vtag" data-video="${h(c.video_id)}">영상 ${vi}</span>`}
      <a href="https://www.youtube.com/watch?v=${h(c.video_id)}&lc=${h(c.id)}" target="_blank" rel="noopener">원문 ↗</a></div></div>`;
  }
  const quotes = (ids, opts) => { const m = commentMap(); const qs = (ids || []).map((id) => m.get(id)).filter(Boolean).sort((a, b) => b.likes - a.likes).slice(0, 4); return qs.length ? `<div class="quotes">${qs.map((c) => quote(c, opts)).join("")}</div>` : ""; };
  const vtags = (ids) => (ids || []).map((id) => `<span class="vtag" data-video="${h(id)}" title="${h(S.bundle.videos.find((v) => v.id === id)?.meta?.title || "")}">영상 ${vIndex(id)}</span>`).join(" ");
  const sentimentChip = (s) => { const k = /긍정/.test(s) ? "good" : /부정/.test(s) ? "bad" : /혼재/.test(s) ? "mix" : ""; return s ? `<span class="chip ${k}">${h(s)}</span>` : ""; };
  const strengthChip = (s) => (s ? `<span class="chip ${s === "상" ? "accent" : ""}">관심도 ${h(s)}</span>` : "");
  function themeBlock(t, i, scope, maxShare) {
    const st = t.stats || {};
    const w = maxShare ? Math.max(3, Math.round((st.share || 0) * 100 / maxShare)) : 0;
    return `<div class="interest"><div class="rank">${String(i + 1).padStart(2, "0")}</div><div>
      <div class="ttl"><h3>${h(t.theme || t.name)}</h3>${strengthChip(t.strength)}${sentimentChip(t.sentiment)}${vtags(t.videos)}</div>
      <p>${h(t.summary)}</p>
      ${t.direction ? `<div class="direction"><b>여론의 방향</b> · ${h(t.direction)}</div>` : ""}
      <div class="meter"><div class="bar"><i style="width:${w}%"></i></div>
        <span>언급 댓글 <b>${num(st.mentions)}</b>개 (${st.share ?? 0}%)</span><span>좋아요 합 <b>${big(st.likes)}</b></span><span>답글 합 <b>${num(st.replies)}</b></span>
        <span class="chip click" data-kw='${h(JSON.stringify({ kws: t.keywords || [], label: t.theme || t.name, video: scope }))}'>관련 댓글 보기 →</span></div>
      <div class="small muted">키워드: ${(t.keywords || []).map(h).join(" · ")}</div>
      ${quotes(t.comment_ids, { showVideo: scope === "all" })}</div></div>`;
  }
  function lensCards(getSummary, getPoints, scopeVideo) {
    const defs = [["popular", "pop", "인기순", "유튜브 알고리즘이 위로 올린 댓글"], ["likes", "like", "좋아요 많은 순", "가장 많은 사람이 공감한 말"], ["replies", "rep", "답글 많은 순", "사람들이 말을 얹고 싶어 한 지점"]];
    const pool = scopeVideo ? (S.bundle.videos.find((v) => v.id === scopeVideo)?.comments?.comments || []) : [...commentMap().values()];
    return `<div class="grid g3">${defs.map(([key, cls, name, hint]) => {
      const top = sortComments(pool, key).slice(0, 3);
      return `<div class="card lens ${cls}"><h3><span class="chip ${cls}">${name}</span></h3><div class="hint">${hint}</div>
        <p>${h(getSummary(key) || "")}</p>${getPoints ? list(getPoints(key)) : ""}
        <div class="quotes">${top.map((c) => quote(c, { showVideo: !scopeVideo })).join("")}</div>
        <div style="margin-top:12px"><span class="chip click ${cls}" data-sort='${h(JSON.stringify({ sort: key, video: scopeVideo || "all" }))}'>${name} 전체 보기 →</span></div></div>`; }).join("")}</div>`;
  }

          <p class="muted small">수집 ${num(v.comments?.comments?.length)}개 중 상위·표본 ${num(r.analyzed_count)}개를 Claude가 정독 · 주제별 수치는 수집 전체 기준</p></div>
        <h2>입장 분포 <span class="sub">Claude 추정치</span></h2>
        <div class="card"><div class="stance-bar">${(r.stances || []).map((x, i) => `<i style="width:${x.share}%;background:${colors[i % 6]}" title="${h(x.label)}"></i>`).join("")}</div>
          ${(r.stances || []).map((x, i) => `<div class="stance-row"><span class="sw" style="background:${colors[i % 6]}"></span><div><b>${h(x.label)}</b> <span class="d">— ${h(x.description)}</span></div><span class="pct">${h(x.share)}%</span></div>`).join("")}</div>
        <h2>관심 주제</h2><div class="card">${(r.themes || []).map((t, i) => themeBlock(t, i, v.id, maxShare)).join("")}</div>
        <h2>세 가지 정렬로 본 댓글</h2>${lensCards((k) => r.lenses?.[k]?.summary, (k) => r.lenses?.[k]?.common_points, v.id)}
        <h2>논쟁이 붙은 스레드</h2><div class="grid g2">${(r.debates || []).map((d) => `<div class="card"><h3>${h(d.topic)}</h3>${quote(cm.get(d.comment_id), { showVideo: false })}
          <div class="sides">${(d.sides || []).map((x, i) => `<div class="side"><b>${"ABCD"[i] || ""} 입장</b>${h(x)}</div>`).join("")}</div><p class="small"><b>시사점</b> · ${h(d.takeaway)}</p></div>`).join("") || `<p class="muted small">해당 없음</p>`}</div>
        <div class="grid g2" style="margin-top:26px">
          <div class="card"><h3>영상에 대한 지적</h3>${list(r.criticism_of_video)}</div>
          <div class="card"><h3>시청자가 더 궁금해하는 것</h3>${list(r.questions_unmet)}</div>
          <div class="card"><h3>댓글 작성자층</h3><p>${h(r.audience)}</p></div>
          <div class="card"><h3>우리 기획 시사점</h3>${list(r.insights_for_us)}</div></div>`;
    } else {
      if (!s) { body.innerHTML = `<div class="empty">${v.transcript && !v.transcript.available ? "자막이 없어 스크립트 요약을 만들지 못했습니다." : "요약 결과가 없습니다."}</div>`; return; }
      body.innerHTML = `
        <div class="card headline-card"><div class="headline" style="font-size:20px">${h(s.one_line)}</div><p>${h(s.core_message)}</p></div>
        <h2>핵심 포인트</h2><div class="card">${(s.key_points || []).map((k) => `<div class="kp">${link(k.time)}<div><div class="pt">${h(k.point)}</div><div class="dt">${h(k.detail)}</div></div></div>`).join("")}</div>
        <h2>인용된 수치·통계</h2><div class="card">${(s.data_cited || []).length ? `<table class="data"><tr><th>수치</th><th>쓰임</th><th>출처</th></tr>${s.data_cited.map((d) => `<tr><td><b>${h(d.figure)}</b></td><td>${h(d.context)}</td><td class="muted">${h(d.source)}</td></tr>`).join("")}</table>` : `<p class="muted small">영상에 인용된 수치가 없습니다.</p>`}</div>
        <h2>구성</h2><div class="card">${(s.structure || []).map((k) => `<div class="kp">${link(k.time)}<div><div class="pt">${h(k.section)}</div><div class="dt">${h(k.role)}</div></div></div>`).join("")}</div>
        <div class="grid g2" style="margin-top:26px">
          <div class="card"><h3>오프닝 후킹</h3><p>${h(s.hook?.opening)}</p><p class="small"><b>기법</b> · ${h(s.hook?.technique)}</p><p class="small"><b>먹히는 이유</b> · ${h(s.hook?.why_it_works)}</p></div>
          <div class="card"><h3>제목·썸네일 전략</h3><p>${h(s.title_thumbnail)}</p><h3 style="margin-top:14px">형식·톤</h3><p>${h(s.tone_format)}</p></div>
          <div class="card" style="grid-column:1/-1"><h3>우리 기획에 참고할 점</h3>${list(s.takeaways_for_us)}</div></div>`;
    }
  }

  // ---------- comments tab ----------
  function filteredComments() {
    const cf = S.cf; let arr = [];
    for (const v of videos()) if (cf.video === "all" || cf.video === v.id) arr = arr.concat(v.comments?.comments || []);
    const q = cf.q.trim().toLowerCase();
    if (q) arr = arr.filter((c) => c.text.toLowerCase().includes(q));
    if (cf.keywords?.length) { const ks = cf.keywords.map((k) => k.toLowerCase()); arr = arr.filter((c) => { const t = c.text.toLowerCase(); return ks.some((k) => t.includes(k)); }); }
    return sortComments(arr, cf.sort);
  }
  function highlight(text) {
    const terms = [...(S.cf.keywords || []), S.cf.q.trim()].filter((x) => x && x.length >= 2);
    let out = h(text); if (!terms.length) return out;
    const re = new RegExp("(" + terms.map((t) => h(t).replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "gi");
    return out.replace(re, "<mark>$1</mark>");
  }
  function renderComments() {
    const view = $("#view"), cf = S.cf;
    const sorts = [["popular", "pop", "인기순"], ["replies", "rep", "답글 많은 순"], ["likes", "like", "좋아요 많은 순"], ["recent", "", "최신순"]];
    view.innerHTML = `<div class="c-controls">
        <div class="row"><div class="seg">${sorts.map(([k, cls, t]) => `<button class="${cf.sort === k ? "active " + cls : ""}" data-csort="${k}">${t}</button>`).join("")}</div>
          <div class="grow"><input type="search" id="c-q" placeholder="댓글 내용 검색" value="${h(cf.q)}"></div></div>
        <div class="row"><select id="c-video" style="max-width:520px"><option value="all">전체 영상</option>${videos().map((v) => `<option value="${h(v.id)}" ${cf.video === v.id ? "selected" : ""}>영상 ${vIndex(v.id)} · ${h(v.meta.title.slice(0, 44))} (${num(v.comments?.comments?.length || 0)})</option>`).join("")}</select>
          <div class="filter-note" id="c-note"></div></div></div><div id="c-list"></div>`;
    $("#c-q").oninput = (e) => { cf.q = e.target.value; cf.limit = 50; renderCommentList(); };
    $("#c-video").onchange = (e) => { cf.video = e.target.value; cf.limit = 50; renderCommentList(); };
    renderCommentList();
  }
  function renderCommentList() {
    const cf = S.cf, arr = filteredComments(), el = $("#c-list"); if (!el) return;
    const sortHint = { popular: "유튜브 「인기 댓글순」 그대로의 순위입니다. 전체 영상 보기에서는 각 영상의 1위, 2위… 순으로 교차 배열합니다.", replies: "답글(대댓글)이 많이 달린 순 — 논쟁·공감이 붙은 댓글입니다.", likes: "좋아요가 많은 순 — 유튜브는 1천 이상을 반올림해 제공합니다(예: 2.7만).", recent: "작성일은 유튜브의 「n개월 전」 표기를 환산한 근사치입니다." }[cf.sort];
    $("#c-note").innerHTML = `<span>${num(arr.length)}개</span>${cf.keywords ? `<span class="chip accent">주제: ${h(cf.label)}</span><span class="chip click" data-clearkw="1">필터 해제 ✕</span>` : ""}<span class="muted">${sortHint}</span>`;
    if (!arr.length) { el.innerHTML = `<div class="empty">조건에 맞는 댓글이 없습니다.</div>`; return; }
    const hl = { popular: "hl-pop", likes: "hl-like", replies: "hl-rep" }[cf.sort] || "";
    el.innerHTML = arr.slice(0, cf.limit).map((c, i) => {
      const v = S.bundle.videos.find((x) => x.id === c.video_id), rs = v?.comments?.replies?.[c.id] || [];
      const open = cf.openReplies[c.id];
      return `<div class="c-item"><div class="c-rank">${i + 1}</div><div>
        <div class="c-text">${highlight(c.text)}</div>
        <div class="c-meta"><span class="num ${cf.sort === "likes" ? hl : ""}">👍 ${num(c.likes)}</span><span class="num ${cf.sort === "replies" ? hl : ""}">💬 답글 ${num(c.reply_count)}</span><span class="num ${cf.sort === "popular" ? hl : ""}">${c.from_recent ? "인기순 밖(최신순 보충)" : `인기 ${c.pop_rank}위`}</span>
          ${c.pinned ? `<span class="chip">📌 고정</span>` : ""}${c.hearted ? `<span class="chip">❤ 채널주 하트</span>` : ""}${c.is_creator ? `<span class="chip accent">채널주</span>` : ""}
          <span>${h(c.author)}</span><span>${h(c.time_text)}</span><span class="vtag" data-video="${h(c.video_id)}" title="${h(v?.meta?.title || "")}">영상 ${vIndex(c.video_id)}</span>
          <a href="https://www.youtube.com/watch?v=${h(c.video_id)}&lc=${h(c.id)}" target="_blank" rel="noopener">원문 ↗</a>
          ${rs.length ? `<span class="chip click rep" data-toggle-replies="${h(c.id)}">${open ? "답글 접기" : `수집된 답글 ${rs.length}개 보기`}</span>` : ""}</div>
        ${open ? `<div class="replies">${rs.map((r) => `<div class="reply">${h(r.text)}<div class="c-meta"><span class="num">👍 ${num(r.likes)}</span><span>${h(r.author)}</span><span>${h(r.time_text)}</span></div></div>`).join("")}</div>` : ""}</div></div>`; }).join("")
      + (arr.length > cf.limit ? `<div style="text-align:center;padding:22px"><button class="btn" id="c-more">더 보기 (${num(arr.length - cf.limit)}개 남음)</button></div>` : "");
    const more = $("#c-more"); if (more) more.onclick = () => { cf.limit += 100; renderCommentList(); };
  }

  // ---------- brief tab ----------
  function renderBrief() {
    const view = $("#view"), p = S.bundle.project;
    if (STATIC) { view.innerHTML = p.brief ? `<div class="card" style="white-space:pre-wrap">${h(p.brief)}</div>` : `<div class="empty">등록된 대본이 없습니다.</div>`; return; }
    view.innerHTML = `<div class="card"><div class="field"><label>우리 대본·기획안 <span>${num((p.brief || "").length)}자 · 종합 인사이트의 「우리 대본 점검」에 쓰입니다</span></label>
      <textarea id="bf-text" rows="22">${h(p.brief || "")}</textarea></div>
      <div class="row"><button class="btn" id="bf-file-btn">파일 불러오기 (docx · txt · md)</button><input type="file" id="bf-file" accept=".docx,.txt,.md" hidden>
      <span style="flex:1"></span><button class="btn" id="bf-save">저장</button><button class="btn primary" id="bf-save-run">저장하고 종합 인사이트 다시 만들기</button></div></div>`;
    $("#bf-file-btn").onclick = () => $("#bf-file").click();
    $("#bf-file").onchange = async (e) => { const file = e.target.files[0]; if (!file) return; const fd = new FormData(); fd.append("file", file);
      try { const r = await api("/api/brief/parse", { method: "POST", body: fd }); $("#bf-text").value = r.text; toast(`${file.name} 불러옴 — 저장을 눌러 반영하세요.`); } catch (err) { toast(err.message); } };
    const save = async () => { const proj = await api(`/api/projects/${encodeURIComponent(S.slug)}`, { method: "PATCH", body: JSON.stringify({ brief: $("#bf-text").value }) }); S.bundle.project = proj; };
    $("#bf-save").onclick = async () => { try { await save(); toast("저장했습니다."); } catch (e) { toast(e.message); } };
    $("#bf-save-run").onclick = async () => { try { await save(); await runMode("synthesis"); } catch (e) { toast(e.message); } };
  }

  // ---------- global events ----------
  document.addEventListener("click", async (e) => {
    const ac = e.target.closest("[data-acc]"); if (ac) return accountAction(ac.dataset.acc, ac.dataset.id);
    if (e.target.id === "acc-modal") return closeAccounts();
    const sb = e.target.closest("[data-share]"); if (sb) return shareAction(sb.dataset.share);
    if (e.target.id === "share-modal") return closeShare();
    if (e.target.closest("[data-accounts]")) return openAccounts();
    const t = e.target.closest("[data-go],[data-tab],[data-pick],[data-subtab],[data-video],[data-kw],[data-sort],[data-csort],[data-clearkw],[data-toggle-replies],[data-run],[data-rerun-video],[data-remove-video]");
    const pop = $("#menu-pop"); if (pop && !e.target.closest(".menu")) pop.hidden = true;
    if (!t) return;
    const d = t.dataset;
    const base = `#/p/${S.slug}`;
    if (d.go) return go(d.go);
    if (d.tab) { S.tab = d.tab; return go(`${base}/${d.tab}`); }
    if (d.pick) { S.videoId = d.pick; renderVideos(); $("#vdetail").scrollIntoView({ behavior: "smooth", block: "start" }); return; }
    if (d.subtab) { S.subtab = d.subtab; return renderVideoDetail(); }
    if (d.video) { e.stopPropagation(); S.videoId = d.video; S.tab = "videos"; go(`${base}/videos/${d.video}`); if (location.hash.endsWith(d.video)) renderProject(); return; }
    if (d.kw) { const k = JSON.parse(d.kw); Object.assign(S.cf, { keywords: k.kws, label: k.label, video: k.video || "all", sort: "likes", q: "", limit: 50 }); S.tab = "comments"; go(`${base}/comments`); window.scrollTo(0, 0); return; }
    if (d.sort) { const k = JSON.parse(d.sort); Object.assign(S.cf, { sort: k.sort, video: k.video, keywords: null, q: "", limit: 50 }); S.tab = "comments"; go(`${base}/comments`); window.scrollTo(0, 0); return; }
    if (d.csort) { S.cf.sort = d.csort; S.cf.limit = 50; return renderComments(); }
    if (d.clearkw) { S.cf.keywords = null; return renderCommentList(); }
    if (d.toggleReplies) { S.cf.openReplies[d.toggleReplies] = !S.cf.openReplies[d.toggleReplies]; return renderCommentList(); }
    if (d.run) return runMode(d.run);
    if (d.rerunVideo) return runMode("reanalyze", d.rerunVideo);
    if (d.removeVideo) { if (!confirm("이 영상을 프로젝트에서 제외할까요? (종합 인사이트는 「다시 분석」으로 갱신하세요)")) return;
      try { await api(`/api/projects/${encodeURIComponent(S.slug)}/videos/${d.removeVideo}`, { method: "DELETE" }); S.videoId = null; await loadBundle(); loadProjects(); } catch (err) { toast(err.message); } }
  });
  window.addEventListener("hashchange", route);

  // ---------- boot ----------
  (async () => {
    if (STATIC) { $("#app").classList.add("static"); return route(); }
    api("/api/health").then((x) => { S.health = x; renderSidebar(); }).catch(() => {});
    loadAccounts();
    if (location.hash === "#/accounts") openAccounts();
    await loadProjects(); route();
  })();
})();

</script>
<script>
(async () => {
  document.getElementById("app").classList.add("static");
  const main = document.getElementById("main");
  const note = (t, d) => { main.innerHTML = `<div class="empty"><h1 style="font-size:20px;margin-bottom:10px">${t}</h1><p>${d}</p></div>`; };
  note("불러오는 중…", "공유된 리서치 결과를 여는 중입니다.");
  try {
    const m = location.hash.match(/k=([A-Za-z0-9_-]{43})/);
    if (!m) return note("링크가 완전하지 않습니다", "주소의 # 뒷부분(열쇠)이 빠졌습니다. 공유받은 링크 <b>전체</b>를 복사해 주소창에 다시 붙여넣어 주세요.");
    if (!window.crypto || !crypto.subtle || !window.DecompressionStream) return note("이 브라우저에서는 열 수 없습니다", "최신 버전의 Chrome · Edge · Safari · Firefox 에서 열어 주세요.");
    const bytes = (s) => { const b = atob(s), a = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; };
    const key = await crypto.subtle.importKey("raw", bytes(m[1].replace(/-/g, "+").replace(/_/g, "/") + "="), "AES-GCM", false, ["decrypt"]);
    const raw = bytes(document.getElementById("ytr-payload").textContent.trim());
    let plain;
    try { plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: raw.slice(0, 12) }, key, raw.slice(12)); }
    catch (e) { return note("링크의 열쇠가 맞지 않습니다", "링크가 중간에 잘렸거나 바뀐 것 같습니다. 공유한 분에게 링크를 다시 받아 주세요."); }
    const text = await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    window.__STATIC_BUNDLE__ = JSON.parse(text);
    window.__YTR_SHARED__ = true;
    const s = document.createElement("script");
    s.textContent = document.getElementById("ytr-app").textContent;
    document.body.appendChild(s);
  } catch (e) { note("열지 못했습니다", String(e && e.message || e)); }
})();
</script>
